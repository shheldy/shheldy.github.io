<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Для Уруйдаана ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a010a;
      font-family: 'Courier New', monospace;
      color: #e0a0ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 90%;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
      color: #ff66b2;
      text-shadow: 0 0 15px #ff3399, 0 0 30px #ff66b2;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p.subtitle {
      font-size: 22px;
      color: #c080ff;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .open-btn {
      padding: 16px 40px;
      font-family: 'Courier New', monospace;
      font-size: 20px;
      color: #fff;
      background: linear-gradient(90deg, #800040, #4d004d);
      border: 2px solid #ff3399;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #ff3399, 0 0 40px #ff3399;
      transition: all 0.3s;
    }

    .open-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px #ff3399, 0 0 60px #ff3399;
    }

    /* Скрытые элементы */
    .hidden {
      display: none !important;
    }

    /* Сердце из слов */
    .heart-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      display: none;
    }

    .heart-word {
      position: absolute;
      font-size: 18px;
      color: #ff4da6;
      text-shadow: 0 0 10px #ff1a8c, 0 0 20px #ff4da6;
      white-space: nowrap;
      opacity: 0;
      animation: appearAndPulse 3s ease-in-out forwards;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 15px #ff3399, 0 0 30px #ff66b2;
      }
      to {
        text-shadow: 0 0 25px #ff66b2, 0 0 50px #ff99cc;
      }
    }

    @keyframes appearAndPulse {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Адаптив для телефонов */
    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }
      p.subtitle {
        font-size: 18px;
      }
      .open-btn {
        font-size: 18px;
        padding: 14px 30px;
      }
      .heart-container {
        width: 320px;
        height: 320px;
      }
      .heart-word {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="mainContent">
    <h1>Уруйдаан, милый мой...</h1>
    <p class="subtitle">
      Эта открытка — для тебя<br>
      Просто так, просто потому что ты у меня есть ❤️
    </p>
    <button class="open-btn" id="openBtn">Нажми сюда</button>
  </div>

  <!-- Сердце из слов (скрыто до нажатия) -->
  <div class="heart-container" id="heartContainer"></div>

  <script>
    // === Сердце из слов ===
    const heartContainer = document.getElementById('heartContainer');
    const words = [
      'love you',
      'my love',
      'my sweety',
      'love',
    ];

    // Функция для создания формы сердца (исправленная)
    function createHeartShape() {
      const positions = [];
      const scale = 12; // Размер сердца
      const centerX = 200; // Центр по X
      const centerY = 200; // Центр по Y

      // Генерируем точки по всей форме сердца
      for (let t = 0; t < Math.PI * 2; t += 0.08) {
        // Формула сердца
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        
        positions.push({
          x: x * scale + centerX,
          y: y * scale + centerY
        });
      }
      return positions;
    }

    const heartPositions = createHeartShape();

    // Распределяем слова равномерно по всему сердцу
    words.forEach((word, index) => {
      const el = document.createElement('div');
      el.className = 'heart-word';
      el.textContent = word;
      
      // Берём позицию из массива, равномерно распределяя
      const posIndex = Math.floor((index / words.length) * heartPositions.length);
      const pos = heartPositions[posIndex];
      
      el.style.left = pos.x + 'px';
      el.style.top = pos.y + 'px';
      el.style.animationDelay = (index * 0.15) + 's';
      
      heartContainer.appendChild(el);
    });

    // === Кнопка и переключение ===
    const openBtn = document.getElementById('openBtn');
    const mainContent = document.getElementById('mainContent');
    const heartContainerEl = document.getElementById('heartContainer');

    openBtn.addEventListener('click', () => {
      // Скрываем основной контент
      mainContent.classList.add('hidden');
      
      // Показываем сердце
      heartContainerEl.style.display = 'block';
    });
  </script>
</body>
</html>
