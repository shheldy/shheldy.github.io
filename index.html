<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Для Уруйдаана ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #050005;
      font-family: 'Courier New', monospace;
      color: #b080ff;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
      color: #d080ff;
      text-shadow: 0 0 15px #8040a0, 0 0 30px #a060c0;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p.subtitle {
      font-size: 22px;
      color: #a070c0;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .open-btn {
      padding: 16px 40px;
      font-family: 'Courier New', monospace;
      font-size: 20px;
      color: #fff;
      background: linear-gradient(90deg, #600040, #400040);
      border: 2px solid #8040a0;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #8040a0, 0 0 40px #8040a0;
      transition: all 0.3s;
    }

    .open-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px #8040a0, 0 0 60px #8040a0;
    }

    .hidden {
      display: none !important;
    }

    /* Бьющееся сердце (SVG) */
    .heart-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      display: none;
      z-index: 3;
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      animation: heartbeat 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 15px #ff0066) drop-shadow(0 0 30px #ff0066);
    }

    .heart-shape {
      fill: #800040;
      stroke: #ff0066;
      stroke-width: 2;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.15);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.1);
      }
      60% {
        transform: scale(1);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 15px #8040a0, 0 0 30px #a060c0;
      }
      to {
        text-shadow: 0 0 25px #a060c0, 0 0 50px #c080ff;
      }
    }

    /* Матрица с "love you" */
    .matrix-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      display: none;
    }

    .matrix-column {
      position: absolute;
      top: -100%;
      font-size: 20px;
      font-weight: bold;
      color: #8040a0;
      text-shadow: 0 0 8px #a060c0, 0 0 15px #c080ff;
      white-space: pre;
      writing-mode: vertical-rl;
      text-orientation: upright;
      transform: rotate(180deg);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100%) rotate(180deg);
      }
      100% {
        transform: translateY(100vh) rotate(180deg);
      }
    }

    /* Адаптив для телефонов */
    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }
      p.subtitle {
        font-size: 18px;
      }
      .open-btn {
        font-size: 18px;
        padding: 14px 30px;
      }
      .heart-container {
        width: 160px;
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <!-- Матрица с "love you" (скрыта до нажатия) -->
  <div class="matrix-container" id="matrixContainer"></div>

  <div class="container" id="mainContent">
    <h1>Уруйдаан, милый мой...</h1>
    <p class="subtitle">
      Эта открытка — только для тебя<br>
      Просто так, прочто потому что ты есть ❤️
    </p>
    <button class="open-btn" id="openBtn">Нажми сюда, сладкий мой</button>
  </div>

  <!-- Бьющееся сердце (скрыто до нажатия) -->
  <div class="heart-container" id="heartContainer">
    <svg class="heart-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path class="heart-shape" d="M50 88.4 L50 88.4 C50 88.4 50 88.4 50 88.4 C16.3 57.7 0 37.9 0 22.9 C0 10.3 10.3 0 22.9 0 C32.1 0 41.1 5.4 46.4 13.3 C47.2 14.5 48.8 14.5 49.6 13.3 C54.9 5.4 63.9 0 73.1 0 C85.7 0 96 10.3 96 22.9 C96 37.9 79.7 57.7 46 88.4 L50 88.4 Z"/>
    </svg>
  </div>

  <script>
    // === Матрица с "love you" ===
    const matrixContainer = document.getElementById('matrixContainer');
    const text = 'love you';
    const columnWidth = 50; // Расстояние между столбиками (увеличил для читаемости)
    const screenWidth = window.innerWidth;
    const numColumns = Math.ceil(screenWidth / columnWidth);

    for (let i = 0; i < numColumns; i++) {
      const column = document.createElement('div');
      column.className = 'matrix-column';
      
      // Генерируем длинную строку из "love you"
      let columnText = '';
      const repeatCount = Math.ceil(window.innerHeight / 25);
      for (let j = 0; j < repeatCount; j++) {
        columnText += 'love\nyou\n';
      }
      column.textContent = columnText;
      
      column.style.left = (i * columnWidth) + 'px';
      column.style.animationDuration = (6 + Math.random() * 4) + 's'; // Замедлил (было 3-7с, стало 6-10с)
      column.style.animationDelay = (Math.random() * 2) + 's';
      
      matrixContainer.appendChild(column);
    }

    // === Кнопка и переключение ===
    const openBtn = document.getElementById('openBtn');
    const mainContent = document.getElementById('mainContent');
    const heartContainer = document.getElementById('heartContainer');

    openBtn.addEventListener('click', () => {
      // Скрываем основной контент
      mainContent.classList.add('hidden');
      
      // Показываем сердце и матрицу
      heartContainer.style.display = 'block';
      matrixContainer.style.display = 'block';
    });
  </script>
</body>
</html>
