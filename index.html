<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Для Уруйдаана ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #050005;
      font-family: 'Courier New', monospace;
      color: #b080ff;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      padding: 20px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
      color: #d080ff;
      text-shadow: 0 0 15px #8040a0, 0 0 30px #a060c0;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p.subtitle {
      font-size: 22px;
      color: #a070c0;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .open-btn {
      padding: 16px 40px;
      font-family: 'Courier New', monospace;
      font-size: 20px;
      color: #fff;
      background: linear-gradient(90deg, #600040, #400040);
      border: 2px solid #8040a0;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #8040a0, 0 0 40px #8040a0;
      transition: all 0.3s;
    }

    .open-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px #8040a0, 0 0 60px #8040a0;
    }

    .hidden {
      display: none !important;
    }

    /* Бьющееся сердце */
    .heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      background: #800040;
      display: none;
      animation: heartbeat 1.2s ease-in-out infinite;
      z-index: 3;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 100px;
      height: 100px;
      background: #800040;
      border-radius: 50%;
    }

    .heart::before {
      top: -50px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 50px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }
      15% {
        transform: translate(-50%, -50%) scale(1.15);
      }
      30% {
        transform: translate(-50%, -50%) scale(1);
      }
      45% {
        transform: translate(-50%, -50%) scale(1.1);
      }
      60% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 15px #8040a0, 0 0 30px #a060c0;
      }
      to {
        text-shadow: 0 0 25px #a060c0, 0 0 50px #c080ff;
      }
    }

    /* Матрица с "love you" */
    .matrix-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      display: none;
    }

    .matrix-column {
      position: absolute;
      top: -100%;
      font-size: 18px;
      color: #602060;
      text-shadow: 0 0 5px #8040a0;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      white-space: nowrap;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100%);
      }
      100% {
        transform: translateY(100vh);
      }
    }

    /* Адаптив для телефонов */
    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }
      p.subtitle {
        font-size: 18px;
      }
      .open-btn {
        font-size: 18px;
        padding: 14px 30px;
      }
      .heart {
        width: 80px;
        height: 80px;
      }
      .heart::before,
      .heart::after {
        width: 80px;
        height: 80px;
      }
      .heart::before {
        top: -40px;
      }
      .heart::after {
        left: 40px;
      }
    }
  </style>
</head>
<body>
  <!-- Матрица с "love you" (скрыта до нажатия) -->
  <div class="matrix-container" id="matrixContainer"></div>

  <div class="container" id="mainContent">
    <h1>Уруйдаан, милый мой...</h1>
    <p class="subtitle">
      Эта открытка — только для тебя.<br>
      Просто так, просто потому что ты у меня есть ❤️
    </p>
    <button class="open-btn" id="openBtn">Нажми сюда</button>
  </div>

  <!-- Бьющееся сердце (скрыто до нажатия) -->
  <div class="heart" id="heart"></div>

  <script>
    // === Матрица с "love you" ===
    const matrixContainer = document.getElementById('matrixContainer');
    const text = 'love you ';
    const columnWidth = 30; // Расстояние между столбиками
    const screenWidth = window.innerWidth;
    const numColumns = Math.ceil(screenWidth / columnWidth);

    for (let i = 0; i < numColumns; i++) {
      const column = document.createElement('div');
      column.className = 'matrix-column';
      
      // Генерируем длинную строку из "love you"
      let columnText = '';
      const repeatCount = Math.ceil(window.innerHeight / 20);
      for (let j = 0; j < repeatCount; j++) {
        columnText += text;
      }
      column.textContent = columnText;
      
      column.style.left = (i * columnWidth) + 'px';
      column.style.animationDuration = (3 + Math.random() * 4) + 's'; // Разная скорость
      column.style.animationDelay = (Math.random() * 2) + 's';
      
      matrixContainer.appendChild(column);
    }

    // === Кнопка и переключение ===
    const openBtn = document.getElementById('openBtn');
    const mainContent = document.getElementById('mainContent');
    const heart = document.getElementById('heart');

    openBtn.addEventListener('click', () => {
      // Скрываем основной контент
      mainContent.classList.add('hidden');
      
      // Показываем сердце и матрицу
      heart.style.display = 'block';
      matrixContainer.style.display = 'block';
    });
  </script>
</body>
</html>
